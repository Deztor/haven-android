<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f3a2e">
  <title>Онови WebView</title>
  <style>
    :root{color-scheme:light dark;--paper:#eceff4;--ink:#1f3a2e;--muted:#4c566a;--accent:#5e81ac}
    @media (prefers-color-scheme:dark){:root{--paper:#1f3a2e;--ink:#eceff4;--muted:#d8dee9;--accent:#88c0d0}}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
    h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;color:var(--muted)}
    a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--accent);color:var(--paper);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <!-- Shown only when the phone's WebView is too old to load Haven safely (MainActivity.load). -->
  <main>
    <h1>Потрібне оновлення WebView</h1>
    <p>Онови «Android System WebView» і Chrome у Play Маркеті, потім відкрий застосунок знову. Поки що Haven можна відкрити в браузері.</p>
    <a href="https://warden-web.lovable.app/">Відкрити в браузері</a>
  </main>
</body>
</html>
